services:
  - type: web
    name: wsp1-platform
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DB_PATH
        value: /data/database.sqlite
      - key: AUTH_DIR
        value: /data/auth_info
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: wsp1-data
      mountPath: /data
      sizeGB: 1
