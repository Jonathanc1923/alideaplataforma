services:
  - type: web
    name: alidea-plataforma
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 3000
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: SILICONFLOW_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: ADMIN_PIN
        sync: false
    disk:
      name: alidea-disk
      mountPath: /var/data
      sizeGB: 10
