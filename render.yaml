services:
  - type: web
    name: alidea-plataforma
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 3000
      - key: AI_ENDPOINT
        value: http://127.0.0.1:11434
    disk:
      name: alidea-disk
      mountPath: /var/data
      sizeGB: 10
